name: cofrinho
description: Controle de gastos pessoais com Flutter Signals e SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gerenciamento de estado reativo (recurso técnico do seminário)
  signals: ^7.1.0

  # Persistência local (SQLite)
  sqflite: ^2.4.1
  # Permite rodar o SQLite também no Windows/Linux (útil para testar no PC)
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
